apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: redirect-https, namespace: home }
spec:
  redirectScheme: { scheme: https, permanent: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home
  namespace: home
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: home, port: { number: 80 } } }
  tls:
    - hosts: [heros-agent.space]
      secretName: home-tls
---
# Plain HTTP gets its own router bound to `web` only: redirectScheme on a router that also
# serves websecure would redirect HTTPS to itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-http-redirect
  namespace: home
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: home-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: home, port: { number: 80 } } }
